<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Management Agent — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", sans-serif;
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 16px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #4A9FFF, #6c63ff);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff;
    }
    .logo-text h1 { font-size: 16px; font-weight: 600; color: #e6edf3; }
    .logo-text p  { font-size: 12px; color: #7d8590; margin-top: 2px; }

    h2 {
      font-size: 22px; font-weight: 600;
      color: #e6edf3; margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px; color: #7d8590; margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block; font-size: 12px; font-weight: 500;
      color: #8b949e; margin-bottom: 6px; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #484f58; font-size: 14px;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px 11px 40px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus {
      border-color: #4A9FFF;
      box-shadow: 0 0 0 3px rgba(74,159,255,0.15);
    }

    .error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #f87171;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }
    .error.visible { display: flex; }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4A9FFF, #6c63ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
    }
    .btn:hover   { opacity: 0.92; }
    .btn:active  { transform: scale(0.99); }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-diagram-project"></i></div>
      <div class="logo-text">
        <h1>Project Management Agent</h1>
        <p>Powered by Gemini · 8 Specialist Agents</p>
      </div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to access your workspace</p>

    <div class="error" id="error-msg">
      <i class="fas fa-triangle-exclamation"></i>
      <span>Invalid username or password. Please try again.</span>
    </div>

    <form method="POST" action="/login">
      <div class="field">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" name="username" placeholder="Enter your username" required autofocus />
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Enter your password" required />
        </div>
      </div>
      <button type="submit" class="btn">
        <i class="fas fa-arrow-right-to-bracket"></i>&nbsp; Sign In
      </button>
    </form>

    <div class="footer">Contact your administrator to request access</div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get("error")) {
      document.getElementById("error-msg").classList.add("visible");
    }
  </script>
</body>
</html>
